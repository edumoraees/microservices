spring.application.name=currency-api

# Consul e a fonte externa das configuracoes da Currency API.
# Porta da API e conexao com o PostgreSQL sao carregadas das chaves
# config/currency-api/* criadas pelo start_consul.bat.
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.config.format=key-value
spring.config.import=consul:
